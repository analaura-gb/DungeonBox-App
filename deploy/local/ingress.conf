server {
    listen 80;
    server_name _;

    location = / {
        return 302 /auth/;
    }

    location /auth/ {
        proxy_pass http://auth-frontend:8080;
    }

    location /store/ {
        proxy_pass http://store-frontend:8080;
    }

    location /ranking/ {
        proxy_pass http://ranking-frontend:8080;
    }

    location /game/ {
        proxy_pass http://game-frontend:8080;
    }

    location /api/auth/ {
        proxy_pass http://auth-backend:3000;
    }

    location /api/store/ {
        proxy_pass http://store-backend:3001;
    }

    location /api/ranking/ {
        proxy_pass http://ranking-backend:3002;
    }

    location /api/game/ {
        proxy_pass http://game-backend:3003;
    }

    location /assets/ {
        proxy_pass http://assets:8080;
    }

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
