name: dungeonbox-local

x-arm: &arm
  platform: linux/arm64

x-backend-env: &backend-env
  JWT_SECRET: ${JWT_SECRET:-simulacao-local-nao-use-em-producao}

services:
  postgres:
    <<: *arm
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - ./initdb.sql:/docker-entrypoint-initdb.d/00-databases.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "15432:5432"

  auth-migrator:
    <<: *arm
    build:
      context: ../../backend/auth
      target: migrator
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/auth_db?schema=public
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  store-migrator:
    <<: *arm
    build:
      context: ../../backend/store
      target: migrator
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/store_db?schema=public
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  ranking-migrator:
    <<: *arm
    build:
      context: ../../backend/ranking
      target: migrator
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ranking_db?schema=public
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  game-migrator:
    <<: *arm
    build:
      context: ../../backend/game
      target: migrator
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/game_db?schema=public
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  auth-backend:
    <<: *arm
    build:
      context: ../../backend/auth
    environment:
      <<: *backend-env
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/auth_db?schema=public
      COOKIE_SECURE: "false"
      STORE_API_URL: http://store-backend:3001
    depends_on:
      postgres: { condition: service_healthy }
      auth-migrator: { condition: service_completed_successfully }

  store-backend:
    <<: *arm
    build:
      context: ../../backend/store
    environment:
      <<: *backend-env
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/store_db?schema=public
    depends_on:
      postgres: { condition: service_healthy }
      store-migrator: { condition: service_completed_successfully }

  ranking-backend:
    <<: *arm
    build:
      context: ../../backend/ranking
    environment:
      <<: *backend-env
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ranking_db?schema=public
    depends_on:
      postgres: { condition: service_healthy }
      ranking-migrator: { condition: service_completed_successfully }

  game-backend:
    <<: *arm
    build:
      context: ../../backend/game
    environment:
      <<: *backend-env
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/game_db?schema=public
      STORE_API_URL: http://store-backend:3001
      RANKING_API_URL: http://ranking-backend:3002
    depends_on:
      postgres: { condition: service_healthy }
      game-migrator: { condition: service_completed_successfully }

  auth-frontend:
    <<: *arm
    build:
      context: ../../frontend/auth
      args:
        VITE_API_BASE_URL: /api
        VITE_AUTH_URL: /auth/
        VITE_STORE_URL: /store/
        VITE_RANKING_URL: /ranking/
        VITE_GAME_URL: /game/

  store-frontend:
    <<: *arm
    build:
      context: ../../frontend/store
      args:
        VITE_API_BASE_URL: /api
        VITE_AUTH_URL: /auth/
        VITE_STORE_URL: /store/
        VITE_RANKING_URL: /ranking/
        VITE_GAME_URL: /game/

  ranking-frontend:
    <<: *arm
    build:
      context: ../../frontend/ranking
      args:
        VITE_API_BASE_URL: /api
        VITE_AUTH_URL: /auth/
        VITE_STORE_URL: /store/
        VITE_RANKING_URL: /ranking/
        VITE_GAME_URL: /game/

  game-frontend:
    <<: *arm
    build:
      context: ../../frontend/game
      args:
        VITE_API_BASE_URL: /api
        VITE_AUTH_URL: /auth/
        VITE_STORE_URL: /store/
        VITE_RANKING_URL: /ranking/
        VITE_GAME_URL: /game/

  assets:
    <<: *arm
    image: nginxinc/nginx-unprivileged:1.27-alpine
    volumes:
      - ../../assets:/usr/share/nginx/html/assets:ro

  ingress:
    <<: *arm
    image: nginx:1.27-alpine
    volumes:
      - ./ingress.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - auth-frontend
      - store-frontend
      - ranking-frontend
      - game-frontend
      - auth-backend
      - store-backend
      - ranking-backend
      - game-backend
      - assets

volumes:
  pgdata:
