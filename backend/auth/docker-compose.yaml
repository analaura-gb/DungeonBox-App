services:
  auth-db:
    image: postgres:16
    container_name: auth-db
    env_file:
      - .env.docker
    environment:
      POSTGRES_DB: auth_db
    ports:
      - '5432:5432'
    volumes:
      - auth-db-data:/var/lib/postgresql/data

  auth-db-test:
    image: postgres:16
    container_name: auth-db-test
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      POSTGRES_DB: auth_db_test
    ports:
      - '5433:5432'
    volumes:
      - auth-db-test-data:/var/lib/postgresql/data

volumes:
  auth-db-data:
  auth-db-test-data:
