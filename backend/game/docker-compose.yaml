services:
  game-db:
    image: postgres:16
    container_name: game-db
    env_file:
      - .env.docker
    environment:
      POSTGRES_DB: game_db
    ports:
      - '5434:5432'
    volumes:
      - game-db-data:/var/lib/postgresql/data

  game-db-test:
    image: postgres:16
    container_name: game-db-test
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      POSTGRES_DB: game_db_test
    ports:
      - '5435:5432'
    volumes:
      - game-db-test-data:/var/lib/postgresql/data

volumes:
  game-db-data:
  game-db-test-data:
