name: Auth Backend CD

on:
  workflow_dispatch:

run-name: Auth Backend CD · ${{ github.ref_name }}

concurrency:
  group: auth-backend-cd
  cancel-in-progress: false

permissions: {}

jobs:
  ci:
    name: Revalidar o CI
    uses: ./.github/workflows/auth-backend-ci.yml
    permissions:
      contents: read

  image:
    name: Buildar e publicar a imagem
    needs: ci
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/dungeonbox-auth-backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve the image tag
        id: tag
        run: echo "value=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        uses: docker/build-push-action@v6
        with:
          context: backend/auth
          push: true
          platforms: linux/arm64
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.value }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha,scope=auth-backend
          cache-to: type=gha,mode=max,scope=auth-backend

      - name: Report the published reference
        env:
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          {
            echo "### Imagem publicada"
            echo
            echo '```'
            echo "${IMAGE}:${TAG}"
            echo '```'
            echo
            echo "Esta e a referencia para o Deployment. Nao use \`latest\` no yaml."
          } >> "$GITHUB_STEP_SUMMARY"
