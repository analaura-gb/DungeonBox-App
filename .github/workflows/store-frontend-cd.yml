name: Store Frontend CD

on:
  workflow_dispatch:

run-name: Store Frontend CD · ${{ github.ref_name }}

concurrency:
  group: store-frontend-cd
  cancel-in-progress: false

permissions: {}

jobs:
  ci:
    name: Revalidar o CI
    uses: ./.github/workflows/store-frontend-ci.yml
    permissions:
      contents: read

  image:
    name: Buildar e publicar a imagem
    needs: ci
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/dungeonbox-store-frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check that the build values are set
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_AUTH_URL: ${{ secrets.VITE_AUTH_URL }}
          VITE_STORE_URL: ${{ secrets.VITE_STORE_URL }}
          VITE_RANKING_URL: ${{ secrets.VITE_RANKING_URL }}
          VITE_GAME_URL: ${{ secrets.VITE_GAME_URL }}
        run: |
          missing=()
          for key in VITE_API_BASE_URL VITE_AUTH_URL VITE_STORE_URL \
                     VITE_RANKING_URL VITE_GAME_URL; do
            [ -n "${!key}" ] || missing+=("$key")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "Faltando no Environment production: ${missing[*]}" >&2
            exit 1
          fi

      - name: Resolve the image tag
        id: tag
        run: echo "value=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        uses: docker/build-push-action@v6
        with:
          context: frontend/store
          push: true
          platforms: linux/arm64
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.value }}
            ${{ env.IMAGE }}:latest
          build-args: |
            VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}
            VITE_AUTH_URL=${{ secrets.VITE_AUTH_URL }}
            VITE_STORE_URL=${{ secrets.VITE_STORE_URL }}
            VITE_RANKING_URL=${{ secrets.VITE_RANKING_URL }}
            VITE_GAME_URL=${{ secrets.VITE_GAME_URL }}
          cache-from: type=gha,scope=store-frontend
          cache-to: type=gha,mode=max,scope=store-frontend

      - name: Report the published reference
        env:
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          {
            echo "### Imagem publicada"
            echo
            echo '```'
            echo "${IMAGE}:${TAG}"
            echo '```'
            echo
            echo "Esta e a referencia para o Deployment. Nao use \`latest\` no yaml."
          } >> "$GITHUB_STEP_SUMMARY"
